name: Hourly Factory Lead Pipeline

on:
  workflow_dispatch: # Keeps the manual button available when you want it
  schedule:
    - cron: '0 * * * *' # Runs automatically at the start of every hour

jobs:
  run-pipeline:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout Code
        uses: actions/checkout@v4

      - name: Setup Python
        uses: actions/setup-python@v5
        with:
          python-version: '3.10'

      - name: Install Packages
        run: |
          pip install requests feedparser beautifulsoup4 groq duckduckgo_search

      - name: Execute Lead Pipeline
        env:
          GROQ_API_KEY: ${{ secrets.GROQ_API_KEY }}
          AIRTABLE_API_KEY: ${{ secrets.AIRTABLE_API_KEY }}
          AIRTABLE_BASE_ID: ${{ secrets.AIRTABLE_BASE_ID }}
        run: python main.py
